<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Yujingwen OS Clear Light launch animation</title>
  <desc id="desc">Animated terminal introduction that links to Yujingwen's portfolio</desc>
  <style>
    :root { color-scheme: light; }
    .window { fill: #f8fafb; stroke: #d8e0e7; stroke-width: 2; }
    .bar { fill: #f1f4f6; }
    .divider { stroke: #d8e0e7; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .title { fill: #526273; font-size: 18px; font-weight: 700; }
    .meta { fill: #9aa7b3; font-size: 12px; letter-spacing: .8px; }
    .line { opacity: 0; animation: reveal 8s ease-in-out infinite; }
    .l1 { animation-delay: .15s; }
    .l2 { animation-delay: .48s; }
    .l3 { animation-delay: .81s; }
    .l4 { animation-delay: 1.14s; }
    .l5 { animation-delay: 1.47s; }
    .l6 { animation-delay: 1.80s; }
    .l7 { animation-delay: 2.13s; }
    .l8 { animation-delay: 2.46s; }
    .body { fill: #566573; font-size: 16px; }
    .prompt { fill: #3478c9; font-size: 16px; font-weight: 700; }
    .ok { fill: #4aa176; font-weight: 700; }
    .accent { fill: #7b5b19; }
    .ready { fill: #3478c9; font-size: 17px; font-weight: 700; opacity: 0; animation: ready 8s ease-in-out infinite; }
    .cta { fill: #526273; font-size: 14px; letter-spacing: 1.8px; opacity: 0; animation: cta 8s ease-in-out infinite; }
    .arrow { fill: #3478c9; font-size: 22px; opacity: 0; animation: arrow 1.4s ease-in-out infinite; animation-delay: 3.9s; }
    .cursor { fill: #3478c9; animation: blink .85s steps(1) infinite; }
    @keyframes reveal {
      0%, 5% { opacity: 0; transform: translateY(5px); }
      10%, 77% { opacity: 1; transform: translateY(0); }
      88%, 100% { opacity: 0; transform: translateY(-2px); }
    }
    @keyframes ready {
      0%, 42% { opacity: 0; transform: translateY(5px); }
      48%, 82% { opacity: 1; transform: translateY(0); }
      92%, 100% { opacity: 0; }
    }
    @keyframes cta {
      0%, 50% { opacity: 0; }
      57%, 84% { opacity: 1; }
      92%, 100% { opacity: 0; }
    }
    @keyframes arrow {
      0%, 100% { opacity: .35; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(7px); }
    }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .ready, .cta, .arrow, .cursor { animation: none; opacity: 1; }
    }
  </style>

  <rect class="window" x="1" y="1" width="998" height="518" rx="18"/>
  <path class="bar" d="M19 2h962a18 18 0 0 1 18 18v31H1V20A18 18 0 0 1 19 2z"/>
  <line class="divider" x1="1" y1="52" x2="999" y2="52"/>
  <circle cx="24" cy="27" r="7" fill="#ef6461"/>
  <circle cx="47" cy="27" r="7" fill="#efbd4e"/>
  <circle cx="70" cy="27" r="7" fill="#55b96f"/>
  <text class="mono meta" x="500" y="31" text-anchor="middle">yujingwen@yjw-mac — zsh — 100×30</text>

  <text class="mono title line l1" x="54" y="93">yujingwen OS v2.0.0 — Clear Light</text>

  <text class="mono body line l2" x="54" y="126">[ <tspan class="ok">OK</tspan> ] 加载产品内核 decision-core.ai</text>
  <text class="mono body line l3" x="54" y="157">[ <tspan class="ok">OK</tspan> ] 挂载 /technology  技术理解</text>
  <text class="mono body line l4" x="54" y="188">[ <tspan class="ok">OK</tspan> ] 挂载 /users       用户洞察</text>
  <text class="mono body line l5" x="54" y="219">[ <tspan class="ok">OK</tspan> ] 挂载 /business    商业判断</text>

  <text class="mono prompt line l6" x="54" y="267">yujingwen@yjw-mac ~ % <tspan class="body">whoami</tspan></text>
  <text class="mono body line l7" x="54" y="298">俞婧雯 · AI Product Manager</text>

  <text class="mono prompt line l8" x="54" y="346">yujingwen@yjw-mac ~ % <tspan class="body">open yujingwen.os</tspan></text>
  <rect class="cursor" x="322" y="328" width="9" height="22" rx="1"/>

  <text class="mono ready" x="54" y="389">SYSTEM READY</text>
  <text class="mono cta" x="500" y="448" text-anchor="middle">CLICK TO LAUNCH · HIWHALEW.GITHUB.IO</text>
  <text class="mono arrow" x="500" y="483" text-anchor="middle">→</text>
</svg>
